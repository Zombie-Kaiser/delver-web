sourceCompatibility = 17
targetCompatibility = 17

configurations.all {
    resolutionStrategy {
        force "com.github.xpenatan:jMultiplatform:0.1.3"
    }
}

configurations {
  reproNatives
}

dependencies {
  implementation project(':core')
  implementation "com.github.xpenatan.gdx-teavm:backend-teavm:1.2.0"
  reproNatives "com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop"
}

task teavm(type: JavaExec) {
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.interrupt.dungeoneer.teavm.TeaVMBuilder'
  workingDir = rootProject.projectDir
}

task repro(type: JavaExec) {
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath + configurations.reproNatives
  mainClass = 'com.interrupt.dungeoneer.teavm.Repro'
  workingDir = rootProject.projectDir
}
